name: Supabase Anti-Inactivity Keep-Alive

on:
  schedule:
    # Chạy tự động mỗi 2 ngày lúc 04:00 UTC (11:00 trưa giờ VN)
    - cron: '0 4 */2 * *'
  workflow_dispatch: # Cho phép bấm chạy thủ công trên GitHub bất kỳ lúc nào

jobs:
  keepalive:
    name: Ping Supabase & Vercel Keep-Alive
    runs-on: ubuntu-latest
    steps:
      - name: Ping All Supabase Databases & Vercel API
        run: |
          echo "=========================================================="
          echo "🚀 BẮT ĐẦU QUY TRÌNH DUY TRÌ CSDL SUPABASE CLOUD (KEEP-ALIVE)"
          echo "=========================================================="

          # 1. Kích hoạt trực tiếp CSDL 1 (fhiuojcvsouwugatnmve)
          echo -n "👉 [1/3] Đang gửi tín hiệu tới CSDL 1 (fhiuojcvsouwugatnmve)... "
          STATUS1=$(curl -s -o /dev/null -w "%{http_code}" -m 10 \
            -H "apikey: sb_publishable_ZH4xsT4R5cWZ3P9uW76IZg_-k3mRtED" \
            -H "Authorization: Bearer sb_publishable_ZH4xsT4R5cWZ3P9uW76IZg_-k3mRtED" \
            "https://fhiuojcvsouwugatnmve.supabase.co/rest/v1/recipes?select=id&limit=1" || echo "ERR")
          echo "Mã phản hồi: $STATUS1"

          # 2. Kích hoạt trực tiếp CSDL 2 (azgjnahbibrcbjooepef)
          echo -n "👉 [2/3] Đang gửi tín hiệu tới CSDL 2 (azgjnahbibrcbjooepef)... "
          STATUS2=$(curl -s -o /dev/null -w "%{http_code}" -m 10 \
            -H "apikey: sb_publishable_Cup5tD9Wt-_-cBcFKJut5g_Wfp8ULkn" \
            -H "Authorization: Bearer sb_publishable_Cup5tD9Wt-_-cBcFKJut5g_Wfp8ULkn" \
            "https://azgjnahbibrcbjooepef.supabase.co/rest/v1/recipes?select=id&limit=1" || echo "ERR")
          echo "Mã phản hồi: $STATUS2"

          # 3. Kích hoạt thông qua Vercel Cron API Endpoint
          echo -n "👉 [3/3] Đang kích hoạt qua Vercel Endpoint (bakery-pos-one)... "
          STATUS3=$(curl -s -o /dev/null -w "%{http_code}" -m 15 \
            "https://bakery-pos-one.vercel.app/api/cron/keep-alive/?source=github-actions" || echo "ERR")
          echo "Mã phản hồi: $STATUS3"

          echo "=========================================================="
          echo "🎉 HOÀN TẤT GỬI TÍN HIỆU KÍCH HOẠT SUPABASE THÀNH CÔNG!"
          echo "=========================================================="
          exit 0
